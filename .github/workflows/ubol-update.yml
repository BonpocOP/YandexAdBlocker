# Еженедельная проверка новой версии движка uBO Lite.
#
# Если вышла новая версия: закрепляем её в vendor/ubol.json (версия и
# SHA-256), собираем Cleathernet и прогоняем тесты — договор с движком
# (dev/ubol-contract.mjs) проверяется при сборке. Всё зелёное — открываем
# pull request; слить и выпустить релиз решает человек. Красное — сценарий
# падает, и GitHub присылает письмо: значит, в новой версии что-то
# поменялось, и разбираться нужно до обновления.
name: uBO Lite update

on:
  schedule:
    - cron: '0 6 * * 1'   # понедельник, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Новая версия?
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node dev/ubol-latest.mjs

      - name: Запрос уже открыт?
        id: open
        if: steps.latest.outputs.changed == 'true'
        run: |
          if git ls-remote --exit-code --heads origin "ubol/${{ steps.latest.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Зависимости и браузер
        if: steps.latest.outputs.changed == 'true' && steps.open.outputs.exists == 'false'
        working-directory: dev
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Сборка и тесты
        if: steps.latest.outputs.changed == 'true' && steps.open.outputs.exists == 'false'
        working-directory: dev
        env:
          YGAB_CHROME: bundled
        run: |
          node build.mjs --check
          node build-extension.mjs
          node test-build.mjs
          node test-game-hook.mjs --ext ../build/extension

      - name: Pull request
        if: steps.latest.outputs.changed == 'true' && steps.open.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.latest.outputs.version }}
          PREVIOUS: ${{ steps.latest.outputs.previous }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "ubol/$VERSION"
          git add vendor/ubol.json
          git commit -m "uBO Lite $PREVIOUS → $VERSION"
          git push origin "ubol/$VERSION"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "ubol/$VERSION" \
            --title "uBO Lite $PREVIOUS → $VERSION" \
            --body "Новая версия движка. Сборка, договор с движком и тесты (сборка, Яндекс.Игры на сборке) прошли. Что изменилось у них: https://github.com/uBlockOrigin/uBOL-home/releases/tag/$VERSION"
